{% extends 'events/base.html' %}

{% block content %}
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
        <div class="card shadow-lg p-4" style="width: 100%; max-width: 600px; border-radius: 12px;">
            <h2 class="text-center fw-bold">{% if object %}Edit{% else %}Create{% endif %} Event</h2>

            <form method="post" class="mt-3">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label fw-semibold">Event Name</label>
                    {{ form.name }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    {{ form.description }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Date</label>
                    {{ form.date }}
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Location</label>
                    {{ form.location }}
                </div>

                <div class="mb-3 d-flex align-items-right gap-2">
                    <label class="form-check-label">Requires Ticket?</label>
                    {{ form.is_ticketed }}
                </div>


                <div class="mb-3">
                <label>We receive 5% of every sale you make on your ticket sales</label>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold">Price</label>
                    {{ form.price }}
                </div>

                <button type="submit" class="btn btn-primary w-100">{% if object %}Update{% else %}Create{% endif %} Event</button>
            </form>
        </div>
    </div>

    <style>
        /* === FORM INPUT STYLING === */
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* === BUTTON STYLING === */
        .btn-primary {
            background: linear-gradient(135deg, #ff7eb3, #ff758c);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #ff758c, #ff5e7d);
        }
    </style>
{% endblock %}
